<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صندوق صوتي</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0e;--bg2:#15233d;--gold:#c9994d;--wax:#27395c;--ink:#e7e8eb;--dim:#9298a3;--paper:#ffffff10;--line:#ffffff24}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font-family:'Tajawal',sans-serif;line-height:1.8;padding:env(safe-area-inset-top) 20px 48px;min-height:100vh}
main{max-width:520px;margin:0 auto}
header{text-align:center;padding:48px 0 24px}
h1{font-family:'Aref Ruqaa',serif;font-size:2.3rem;line-height:1.5}
.msg{color:var(--dim);margin-top:8px}
h2{font-family:'Aref Ruqaa',serif;font-size:1.35rem;margin:32px 0 12px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* الرسائل */
.letter{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 20px 20px;margin-bottom:14px;overflow:hidden}
.letter>button{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:18px;box-sizing:border-box}
.seal{flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a6590,var(--wax));display:grid;place-items:center;font-size:1.2rem;box-shadow:0 2px 10px #0006;transition:transform .5s}
.letter.open .seal{transform:rotate(-25deg) scale(.88);background:#ffffff1c;box-shadow:none}
.when small{display:block;color:var(--dim);font-size:.85rem}
.when b{font-family:'Aref Ruqaa',serif;font-size:1.25rem;font-weight:700}
.body{max-height:0;overflow:hidden;transition:max-height .5s ease}
.letter.open .body{max-height:760px}
.inner{padding:0 18px 20px}
.ayah{font-family:'Aref Ruqaa',serif;font-size:1.5rem;line-height:2.2;text-align:center;color:var(--gold);margin:4px 0 2px}
.ref{text-align:center;color:var(--dim);font-size:.9rem;margin-bottom:16px}
.note p+p{margin-top:6px}
.note{color:var(--ink);margin-bottom:14px;border-right:3px solid var(--gold);padding-right:12px}
.play{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#1b1a12;padding:10px 20px;border-radius:999px;font-weight:500}
.play.on{background:#ffffff1f;color:var(--gold);outline:1px solid var(--gold)}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold)}

/* الأصوات */
.sound{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 16px;margin-bottom:8px}
.sound.on{border-color:var(--gold)}
.sound button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;flex:1;font-size:1.05rem}
.sound input{width:90px;accent-color:var(--gold)}
.timer{display:flex;gap:8px;flex-wrap:wrap}
.timer button{all:unset;cursor:pointer;padding:7px 16px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
.timer button.on{background:var(--gold);color:#1b1a12;border-color:var(--gold)}
#left{color:var(--dim);min-height:1.8em;margin-top:6px}
.letter.seen .when b{color:var(--dim)}
.hint{color:var(--dim);font-size:.9rem;text-align:center;margin-top:28px}
@media (prefers-reduced-motion:reduce){.body,.seal{transition:none}}
</style>
</head>
<body>
<main>
<header>
  <h1 id="title"></h1>
  <p class="msg" id="msg"></p>
</header>

<h2>رسائل لك</h2>
<div id="letters"></div>

<h2>أصوات تنام عليها</h2>
<div id="sounds"></div>

<h2>المؤقّت</h2>
<div class="timer" id="timer"></div>
<div id="left"></div>

<p class="hint">خفّض الصوت أو استخدم سماعات قبل النوم</p>
</main>

<script>
/* ====== عدّلي هنا ====== */
const NAME = "عُمر";
const MESSAGE = "هذا الصندوق كله لك. افتح كل رسالة وقت ما تحتاجها.";
// when = العنوان بعد "افتحها" | ayah = نص الآية | ref = اسم السورة ورقم الآية
// note = كلمة منك: نص واحد، أو قائمة نصوص مثل ["جملة 1", "جملة 2"] (اختياري) | src = ملف التلاوة، أو عدة ملفات بالترتيب لو أكثر من آية
const LETTERS = [
  { when: "إذا ما جاك النوم",
    ayah: "(ٱلَّذِينَ ءَامَنُواْ وَتَطۡمَئِنُّ قُلُوبُهُم بِذِكۡرِ ٱللَّهِۗ أَلَا بِذِكۡرِ ٱللَّهِ تَطۡمَئِنُّ ٱلۡقُلُوبُ)",
    ref: "سورة الرعد · الآية 28",
    note: "خذ نفس عميق وخل الصوت يكمل عنك.",
    src: ["audio/s1.mp3"] },
  { when: "إذا كان يومك ثقيل",
    ayah: "(فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا (5) إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرٗا)",
    ref: "سورة الشرح · الآيتان 5 و6",
    note: ["الأيام الثقيلة تعدي، وأنت أقوى مما تحس الحين.", "تعبك له قيمة، حتى لو ما أحد قال لك."],
    src: ["audio/s2.mp3"] },
  { when: "إذا صحيت في نص الليل",
    ayah: "(وَٱلضُّحَىٰ (1) وَٱلَّيۡلِ إِذَا سَجَىٰ (2) مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ)",
    ref: "سورة الضحى · الآيات 1 إلى 3",
    note: "ربك ما ودّعك وما قلى، فنام وأنت مطمئن.",
    src: ["audio/s3.mp3"] },
];
/* ====================== */

document.getElementById('title').textContent = 'صندوق ' + NAME;
document.getElementById('msg').textContent = MESSAGE;

const voice = new Audio();
let current = null, ctx, master, noiseBufs = {}, duck = 1;
const active = {};

let queue = [], qi = 0;
/* الرسائل */
const lbox = document.getElementById('letters');
const seenKey = L => 'seen:' + L.when;
LETTERS.forEach(L => {
  const el = document.createElement('div'); el.className = 'letter';
  el.innerHTML = `<button aria-expanded="false"><span class="seal">☾</span><span class="when"><small>افتحها</small><b>${L.when}</b></span></button>
  <div class="body"><div class="inner">${L.ayah ? `<p class="ayah">${L.ayah}</p><p class="ref">${L.ref}</p>` : ''}${L.note ? `<div class="note">${[].concat(L.note).map(n => `<p>${n}</p>`).join('')}</div>` : ''}${L.src ? `<button class="play">▶ استمع</button><div class="bar"><i></i></div>` : ''}</div></div>`;
  try { if (localStorage.getItem(seenKey(L))) el.classList.add('seen') } catch (e) {}
  const head = el.querySelector(':scope>button');
  head.onclick = () => {
    const open = el.classList.toggle('open');
    head.setAttribute('aria-expanded', open);
    if (open) try { localStorage.setItem(seenKey(L), '1'); el.classList.add('seen') } catch (e) {}
    if (!open && current === el) stopVoice();
  };
  const play = el.querySelector('.play');
  if (play) play.onclick = () => {
    if (current === el) { stopVoice(); return }
    stopVoice(); current = el; queue = [].concat(L.src); qi = 0;
    play.classList.add('on'); play.textContent = '❚❚ إيقاف'; setDuck(0);
    voice.src = queue[0];
    voice.play().catch(e => { play.classList.remove('on'); play.textContent = 'تعذّر التشغيل: ' + queue[0] + ' (' + e.name + ')'; current = null; setDuck(1) });
  };
  lbox.appendChild(el);
});
function stopVoice() {
  voice.pause();
  if (current) {
    const p = current.querySelector('.play'); p.classList.remove('on'); p.textContent = '▶ استمع';
    current.querySelector('.bar i').style.width = '0'; current = null
  }
  setDuck(1)
}
voice.ontimeupdate = () => { if (current && voice.duration) current.querySelector('.bar i').style.width = ((qi + voice.currentTime / voice.duration) / queue.length * 100) + '%' };
voice.onended = () => { if (current && ++qi < queue.length) { voice.src = queue[qi]; voice.play() } else stopVoice() };
function setDuck(v) { duck = v; if (master) master.gain.setTargetAtTime(v, ctx.currentTime, .6) }

/* الأصوات */
function init() {
  if (ctx) { ctx.resume(); return }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = duck; master.connect(ctx.destination);
  const len = ctx.sampleRate * 4;
  ['white', 'pink', 'brown'].forEach(t => {
    const b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    let l = 0, b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (t === 'white') d[i] = w * .5;
      else if (t === 'brown') { l = (l + .02 * w) / 1.02; d[i] = l * 3.5 }
      else { b0 = .99765 * b0 + w * .099; b1 = .963 * b1 + w * .2965; b2 = .57 * b2 + w * 1.0526; d[i] = (b0 + b1 + b2 + w * .1848) * .11 }
    }
    noiseBufs[t] = b
  })
}
const noise = t => { const s = ctx.createBufferSource(); s.buffer = noiseBufs[t]; s.loop = true; s.start(); return s };
const lfo = (f, depth, target) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; g.gain.value = depth; o.connect(g).connect(target); o.start(); return o };

const SOUNDS = {
  rain: { name: 'مطر', ic: '🌧️', file: 'audio/rain.mp3', build(out) { const n = noise('pink'), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700; n.connect(hp).connect(out); return [n] } },
  ocean: { name: 'بحر', ic: '🌊', file: 'audio/ocean.mp3', build(out) { const n = noise('brown'), lp = ctx.createBiquadFilter(), g = ctx.createGain(); lp.type = 'lowpass'; lp.frequency.value = 600; g.gain.value = .55; const o = lfo(.1, .45, g.gain); n.connect(lp).connect(g).connect(out); return [n, o] } },
  wind: { name: 'رياح + مطر', ic: '🍃', file: 'audio/wind.mp3', build(out) { const n = noise('pink'), bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = .8; const o = lfo(.07, 300, bp.frequency); n.connect(bp).connect(out); return [n, o] } },
  fire: { name: 'نار هادئة', ic: '🔥', file: 'audio/fire.mp3', build(out) {
    const n = noise('brown'), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400; n.connect(lp).connect(out);
    const t = setInterval(() => {
      const s = ctx.createBufferSource(); s.buffer = noiseBufs.white;
      const g = ctx.createGain(), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500 + Math.random() * 2500;
      g.gain.setValueAtTime(.5 * Math.random(), ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .05);
      s.connect(hp).connect(g).connect(out); s.start(0, Math.random() * 3, .06)
    }, 180 + Math.random() * 200);
    return [n, { stop() { clearInterval(t) } }] } }
};
const sbox = document.getElementById('sounds'), rows = {};
Object.entries(SOUNDS).forEach(([k, s]) => {
  const row = document.createElement('div'); row.className = 'sound';
  row.innerHTML = `<button aria-pressed="false"><span>${s.ic}</span><span>${s.name}</span></button><input type="range" min="0" max="1" step=".01" value=".6" aria-label="مستوى ${s.name}">`;
  const btn = row.querySelector('button'), vol = row.querySelector('input');
  rows[k] = { row, btn, vol };
  btn.onclick = () => setSound(k, !active[k]);
  vol.oninput = () => { if (active[k]) active[k].gain.gain.value = +vol.value };
  sbox.appendChild(row)
});
const buffers = {};
async function loadFile(k) {
  if (k in buffers) return buffers[k];
  try { const r = await fetch(SOUNDS[k].file); if (!r.ok) throw 0; buffers[k] = await ctx.decodeAudioData(await r.arrayBuffer()) }
  catch (e) { buffers[k] = null }
  return buffers[k]
}
function setSound(k, on) {
  init();
  const { row, btn, vol } = rows[k];
  if (!on) { if (active[k]) { stopSound(k); row.classList.remove('on'); btn.setAttribute('aria-pressed', 'false') } return }
  if (active[k]) return;
  master.gain.cancelScheduledValues(0); master.gain.value = duck;
  const gain = ctx.createGain(); gain.gain.value = 0; gain.connect(master);
  gain.gain.linearRampToValueAtTime(+vol.value, ctx.currentTime + 2);
  const entry = { gain, nodes: [], row, btn }; active[k] = entry;
  row.classList.add('on'); btn.setAttribute('aria-pressed', 'true');
  // يستخدم الملف الحقيقي من مجلد audio، وإذا ما لقاه يولّد الصوت بالكود
  loadFile(k).then(buf => {
    if (active[k] !== entry) return;
    if (buf) { const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(gain); src.start(); entry.nodes = [src] }
    else entry.nodes = SOUNDS[k].build(gain)
  })
}
function stopSound(k) { const a = active[k]; if (!a) return; a.nodes.forEach(n => { try { n.stop() } catch (e) {} }); a.gain.disconnect(); delete active[k] }
function stopAll() { Object.keys(active).forEach(k => { active[k].row.classList.remove('on'); active[k].btn.setAttribute('aria-pressed', 'false'); stopSound(k) }); stopVoice() }

/* المؤقّت */
let tEnd = 0, tInt = null;
const tbox = document.getElementById('timer'), left = document.getElementById('left');
[15, 30, 60, 90].forEach(m => {
  const b = document.createElement('button'); b.textContent = m + ' دقيقة';
  b.onclick = () => { if (b.classList.contains('on')) { clearTimer(); return } clearTimer(); b.classList.add('on'); tEnd = Date.now() + m * 60000; tInt = setInterval(tick, 1000); tick() };
  tbox.appendChild(b)
});
function tick() {
  const r = tEnd - Date.now();
  if (r <= 0) {
    if (master) master.gain.linearRampToValueAtTime(0, ctx.currentTime + 8);
    setTimeout(() => { stopAll(); if (master) master.gain.value = 1; duck = 1 }, 8500);
    clearTimer(true); return
  }
  left.textContent = 'يتوقف الصوت بعد ' + Math.ceil(r / 60000) + ' دقيقة'
}
function clearTimer(done) { clearInterval(tInt); tInt = null; tbox.querySelectorAll('button').forEach(b => b.classList.remove('on')); left.textContent = done ? 'تصبح على خير 🌙' : '' }
</script>
</body>
</html>
